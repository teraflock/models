name: promote

# Promote the catalog to the STABLE object (catalog/catalog.json on the
# downloads bucket), the URL every fresh flockd install reads by default
# (models.manifest_url). Same shape as runtimes/promote.yml: main merges
# only refresh the staging object (ci.yml); writing stable is this
# deliberate, reviewed step, run in the `stable` GitHub environment whose
# required reviewer must approve the run — that approval is the audit trail.
#
# Triggers: a release tag push (vYYYY.MM.N, e.g. v2026.09.1 — the catalog
# is data, so it is dated, not semver'd) or a manual dispatch on any ref
# (rollback = dispatch on the previous tag). Either way the tree is
# validated in release mode first: every TODO-verify placeholder is fatal
# (CLAUDE.md rule 3 says never invent a hash; this is what keeps the
# placeholder from ever reaching a node).
#
# Reviewer checklist (the workflow cannot verify these; approve only when
# all hold):
#   1. The step summary's added/removed entries are the ones the tag was
#      cut for — nothing unexpected drops out of production.
#   2. Fingerprint expected outputs exist in the control plane for every
#      added (model_sha, quant) × current runtime_build_id (README,
#      "Adding a model" step 5); otherwise the new quant is unverifiable
#      the moment nodes pick it up.
#   3. A canary node served the staging object
#      (catalog/catalog-staging.json) with the new entries.
#   4. Pricing did not change unless SPEC §7 changed first (the validator
#      enforces the table; a SPEC edit is the review, not this run).
#
# The uploader IAM user is write-only; the stable object is read back over
# the public bucket URL.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One promotion at a time; never cancel a promotion that has started.
concurrency:
  group: promote-stable
  cancel-in-progress: false

env:
  BUCKET: teraflock-downloads
  PUBLIC_URL: https://teraflock-downloads.s3.amazonaws.com/catalog/catalog.json

jobs:
  promote:
    name: promote ${{ github.ref_name }} to catalog.json
    runs-on: ubuntu-22.04
    environment:
      name: stable
      url: https://teraflock-downloads.s3.amazonaws.com/catalog/catalog.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: tools/validate/go.sum

      - name: Check the ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && ! "${GITHUB_REF_NAME}" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::release tags are vYYYY.MM.N (got '${GITHUB_REF_NAME}')"; exit 1
          fi
          {
            echo "## Promote ${GITHUB_REF_NAME} (${GITHUB_REF_TYPE}) to catalog.json"
            echo
            echo "- commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate in release mode and emit the catalog
        working-directory: tools/validate
        run: |
          set -euo pipefail
          go test ./...
          go run . -root ../.. -release -emit-flat ../../catalog.json

      - name: Verify the emitted catalog
        # Belt and braces over the validator: no placeholder of any kind,
        # every hash a node will check is a 64-hex digest.
        run: |
          set -euo pipefail
          if grep -q "TODO" catalog.json; then
            echo "::error::emitted catalog contains a TODO placeholder"; exit 1; fi
          jq -e '.models | length > 0' catalog.json >/dev/null || {
            echo "::error::emitted catalog has no models"; exit 1; }
          jq -e '[.models[] | .sha256, (.parts[]?.sha256), (.mmproj?.sha256 // empty)]
                 | all(test("^[0-9a-f]{64}$"))' catalog.json >/dev/null || {
            echo "::error::a sha256 in the emitted catalog is not a 64-hex digest"; exit 1; }
          echo "- entries: $(jq '.models | length' catalog.json) (model, quant) pairs from $(find catalog -name '*.yaml' | wc -l | tr -d ' ') manifests" >> "$GITHUB_STEP_SUMMARY"

      - name: Diff against the current stable object
        run: |
          set -euo pipefail
          if curl -fsSL "${PUBLIC_URL}" -o stable-before.json; then
            jq -r '.models[].id' stable-before.json | sort > before.ids
            jq -r '.models[].id' catalog.json | sort > after.ids
            {
              echo "- previous stable: $(jq '.models | length' stable-before.json) entries"
              echo "- added:"; comm -13 before.ids after.ids | sed 's/^/  - /'
              echo "- removed:"; comm -23 before.ids after.ids | sed 's/^/  - /'
              echo "- hash changed:"
              jq -r '.models[] | "\(.id) \(.sha256)"' stable-before.json | sort > before.sha
              jq -r '.models[] | "\(.id) \(.sha256)"' catalog.json | sort > after.sha
              comm -12 before.ids after.ids | while read -r id; do
                b=$(grep "^${id} " before.sha | cut -d' ' -f2); a=$(grep "^${id} " after.sha | cut -d' ' -f2)
                [[ "$b" == "$a" ]] || echo "  - ${id}"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- previous stable: <none>" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$GITHUB_STEP_SUMMARY"

      - name: Promote to the stable object
        # Same teraflock-ci-uploader credentials as ci.yml (write-only on
        # teraflock-downloads).
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          aws s3 cp catalog.json "s3://${BUCKET}/catalog/catalog.json" \
            --content-type application/json \
            --metadata "git-commit=${GITHUB_SHA},git-ref=${GITHUB_REF_NAME}"

      - name: Verify the stable object
        run: |
          set -euo pipefail
          curl -fsSL "${PUBLIC_URL}" -o stable-after.json
          if ! diff <(jq -S . catalog.json) <(jq -S . stable-after.json); then
            echo "::error::stable object does not match the emitted catalog"; exit 1; fi
          echo "- new stable: $(jq '.models | length' stable-after.json) entries" >> "$GITHUB_STEP_SUMMARY"

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: tools/validate/go.sum

      - name: gofmt
        working-directory: tools/validate
        run: test -z "$(gofmt -l .)"

      - name: go vet
        working-directory: tools/validate
        run: go vet ./...

      - name: unit + integration tests
        working-directory: tools/validate
        run: go test ./...

      - name: validate catalog
        working-directory: tools/validate
        run: go run . -root ../..

# Teraflock model manifest — schema/manifest.schema.json
# sha256/size_bytes verified against the HuggingFace API (ggml-org/Qwen3.6-27B-GGUF), 2026-10-27.
# tok_s_estimates are rough single-stream decode estimates, NOT benchmarks.
#
# Dense 27.8B, Qwen3.6 generation on the Qwen3.5 architecture (`qwen3_5`:
# 64 layers, Gated DeltaNet linear attention with full attention every 4th
# layer) — the same architecture the catalogued Qwen3.8-27B and
# Qwen3.6-35B-A3B already run on, so the pinned runtime (llama.cpp b11382)
# loads it without a pin bump. Thinking mode is the upstream default
# (`<think>…</think>` before the answer; `enable_thinking: false` in
# chat_template_kwargs turns it off). Upstream is a vision-language release;
# we serve TEXT ONLY (the mmproj, mtp and dflash sidecar files are
# deliberately not catalogued — vision and speculative decoding need
# runtime plumbing the mesh doesn't have yet). Qwen ships no coder or
# thinking-only variant at 27B: this one manifest is the whole family.
# ggml-org converted from Qwen/Qwen3.6-27B commit 6a9e13bd (.src_sha).

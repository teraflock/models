# Teraflock model manifest — schema/manifest.schema.json
# sha256/size_bytes verified against the HuggingFace API (ggml-org/Kev-4B-GGUF), 2026-10-03.
# DECISION MODEL (decision: true): served via /v1/systemone, returns typed
# probabilities, generates no tokens. tok_s_estimates are therefore NOT decode
# speeds: they are rough prompt-processing (input tokens evaluated per second)
# estimates, NOT benchmarks; decision requests are exempt from timing checks.
# Needs a runtime build with llama.cpp >= b11382 (proto design note
# 2026-10-03-decision-models).
#
# Kev-4B (Jared Palmer): a LoRA adapter and pointer head merged onto
# Qwen/Qwen3.5-4B-Base, run prefill-only; 4.21B parameters in the GGUF.
# Source model jaredpalmer/kev-4b. English.
# Context: the source card serves states of up to 65,536 tokens (listed
# here) but VALIDATES accuracy only to 8,192, the trained length; the GGUF
# metadata carries the backbone's 262,144. min_vram_mb/min_ram_mb follow the
# catalog's size-based rule and do not budget a full 65K-token state (the
# card measures about 4.6 GB above the weights for one on Apple Silicon).
id: kev-4b
display_name: Kev-4B
family: kev
params_b: 4.2
architecture: dense
license:
  name: Apache-2.0
  url: https://huggingface.co/jaredpalmer/kev-4b
  notes: >-
    Apache-2.0 (OSI). No usage or relicensing conditions; the base model (Qwen/Qwen3.5-4B-Base) is
    Apache-2.0 too; upstream ships no
    NOTICE file, so §4(d) adds nothing. Checked 2026-10-03 (source and GGUF
    repos ungated, both tagged apache-2.0): see LICENSES.md.
payout_class: small # decision models carry the class row unchanged (SPEC §7 note)
context_length: 65536
embeddings: false
decision: true
fingerprint_set_id: fp-decision-v1
price_in_per_mtok: 0.018 # USD per Mtok interactive, batch 0.5x — SPEC §7 (2026-09-12); decision models bill input tokens only
price_out_per_mtok: 0.036 # class row, never applies: no output tokens
payout_share: 0.45 # share of the charge paid to the node
source_repo: https://huggingface.co/ggml-org/Kev-4B-GGUF
